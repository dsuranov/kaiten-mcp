name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Verify workflow supply-chain policy
        run: go run ./scripts/verify-workflows.go

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Run release checks
        shell: bash
        run: |
          go mod verify
          go run ./scripts/verify-dependency-policy.go
          go test ./scripts/verify-native-lifecycle-evidence.go ./scripts/verify-native-lifecycle-evidence_test.go
          go test ./scripts/prepare-native-lifecycle-release.go ./scripts/prepare-native-lifecycle-release_test.go
          go test ./scripts/sanitize-native-lifecycle-evidence.go ./scripts/sanitize-native-lifecycle-evidence_test.go
          (cd scripts && go test ./cleanup-native-lifecycle-linux_test.go)
          go vet ./...
          go test ./...
          go test -race ./...

  build:
    name: Build and verify release assets
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Install pinned binary vulnerability scanner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-tools"
          GOBIN="$RUNNER_TEMP/security-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$RUNNER_TEMP/security-tools/govulncheck" -version

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.50.0

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Build twice and prove byte reproducibility
        shell: bash
        run: ./scripts/verify-reproducible-release.sh

      - name: Validate release evidence
        shell: bash
        run: |
          test -s dist/checksums.txt
          archive_count="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')"
          test "$archive_count" -eq 10
          sbom_count="$(find dist -maxdepth 1 -type f -name '*.sbom.json' | wc -l | tr -d ' ')"
          test "$sbom_count" -eq 10
          find dist -maxdepth 1 -type f -name '*.sbom.json' -print0 | xargs -0 -n1 jq -e . >/dev/null
          (cd dist && sha256sum --check checksums.txt)
          grep -Fq '[Clean-room provenance](PROVENANCE.md)' README.md
          for archive in dist/*.tar.gz dist/*.zip; do
            if [[ "$archive" == *.zip ]]; then
              entries="$(unzip -Z1 "$archive")"
            else
              entries="$(tar -tzf "$archive")"
            fi
            grep -Eq '/README\.md$' <<<"$entries"
            grep -Eq '/PROVENANCE\.md$' <<<"$entries"
          done

      - name: Verify packaged binary toolchains and vulnerabilities
        shell: bash
        env:
          GOVULNCHECK_BIN: ${{ runner.temp }}/security-tools/govulncheck
        run: |
          scan_root="$(mktemp -d)"
          trap 'rm -rf -- "$scan_root"' EXIT
          archive_index=0
          for archive in dist/*.tar.gz dist/*.zip; do
            archive_index=$((archive_index + 1))
            destination="$scan_root/$archive_index"
            mkdir -p "$destination"
            if [[ "$archive" == *.zip ]]; then
              unzip -q "$archive" -d "$destination"
            else
              tar -xzf "$archive" -C "$destination"
            fi
          done
          mapfile -d '' packaged_binaries < <(
            find "$scan_root" -type f \
              \( -name kaiten -o -name kaiten.exe -o -name kaiten-mcp -o -name kaiten-mcp.exe \) \
              -print0
          )
          test "${#packaged_binaries[@]}" -eq 15
          ./scripts/verify-go-binaries.sh "${packaged_binaries[@]}"

      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reproducibility-evidence
          path: dist/reproducibility.txt
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest checksum manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: dist

      - name: Attest checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-checksums: ./dist/checksums.txt

  publish:
    name: Create draft release
    needs:
      - build
      - attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: dist

      - name: Create draft with verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sbom.json' -o -name checksums.txt \) \
              -print0
          )
          test "${#assets[@]}" -eq 21
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes
