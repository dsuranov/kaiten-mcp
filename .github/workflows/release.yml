name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release checks
        shell: bash
        run: |
          go mod verify
          go vet ./...
          go test ./...
          go test -race ./...

  release:
    name: Build draft release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.50.0

      - name: Build archives, checksums, and SBOMs
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release evidence
        shell: bash
        run: |
          test -s dist/checksums.txt
          archive_count="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')"
          test "$archive_count" -eq 10
          sbom_count="$(find dist -maxdepth 1 -type f -name '*.sbom.json' | wc -l | tr -d ' ')"
          test "$sbom_count" -eq 10
          find dist -maxdepth 1 -type f -name '*.sbom.json' -print0 | xargs -0 -n1 jq -e . >/dev/null
          (cd dist && sha256sum --check checksums.txt)
          grep -Fq '[Clean-room provenance](PROVENANCE.md)' README.md
          for archive in dist/*.tar.gz dist/*.zip; do
            if [[ "$archive" == *.zip ]]; then
              entries="$(unzip -Z1 "$archive")"
            else
              entries="$(tar -tzf "$archive")"
            fi
            grep -Eq '/README\.md$' <<<"$entries"
            grep -Eq '/PROVENANCE\.md$' <<<"$entries"
          done

      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt
