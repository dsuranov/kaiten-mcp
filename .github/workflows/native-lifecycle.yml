name: Native lifecycle

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact lowercase 40-character head SHA of the successful Release run
        required: true
        type: string
      release_run_id:
        description: Successful Release workflow run ID whose release-assets will be tested
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  native-lifecycle:
    name: Native lifecycle (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-amd64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-latest
          - id: linux-amd64
            runner: ubuntu-latest
          - id: linux-arm64
            runner: ubuntu-24.04-arm
          - id: windows-amd64
            runner: windows-latest
    steps:
      - name: Validate immutable release inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_SHA"
          [[ "$WORKFLOW_REF" =~ ^refs/tags/v[0-9][0-9A-Za-z.+-]*$ ]]

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Install Linux user-session DBus prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-user-session

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        shell: bash
        run: ./scripts/verify-go-toolchain.sh

      - name: Verify harness helpers and workflow policy
        shell: bash
        run: |
          go run ./scripts/verify-workflows.go
          go run ./scripts/verify-dependency-policy.go
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
          go test ./scripts/verify-native-lifecycle-evidence.go ./scripts/verify-native-lifecycle-evidence_test.go
          go test ./scripts/prepare-native-lifecycle-release.go ./scripts/prepare-native-lifecycle-release_test.go
          go test ./scripts/sanitize-native-lifecycle-evidence.go ./scripts/sanitize-native-lifecycle-evidence_test.go
          go vet ./internal/nativeci ./cmd/native-lifecycle-harness ./cmd/native-lifecycle-bad-service
          go test ./internal/nativeci

      - name: Run harness helper race tests
        if: matrix.id == 'linux-amd64'
        shell: bash
        run: |
          go test -race ./internal/nativeci
          (cd scripts && go test ./cleanup-native-lifecycle-linux_test.go)

      - name: Bind exact Release bytes to native lifecycle
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          go run ./scripts/prepare-native-lifecycle-release.go \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RELEASE_RUN_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --work "$RUNNER_TEMP/native-release-binding" \
            --output "$RUNNER_TEMP/native-lifecycle-build/release" \
            --metadata "$RUNNER_TEMP/native-lifecycle-build/release-binding.txt"

      - name: Build local v1 and bad-v3 fixtures
        shell: bash
        run: ./scripts/build-native-lifecycle-fixtures.sh "$RUNNER_TEMP/native-lifecycle-build"

      - name: Run native lifecycle gate
        shell: bash
        env:
          NATIVE_CI_RUNNER_LABEL: ${{ matrix.runner }}
          NATIVE_CI_RUNNER_ID: ${{ matrix.id }}
          NATIVE_CI_EXPECTED_SHA: ${{ inputs.expected_sha }}
          NATIVE_CI_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: ./scripts/run-native-lifecycle-ci.sh "$RUNNER_TEMP/native-lifecycle-build" "$RUNNER_TEMP/native-lifecycle-evidence"

      - name: Sanitize native lifecycle evidence
        id: sanitize
        if: always()
        shell: bash
        run: go run ./scripts/sanitize-native-lifecycle-evidence.go "$RUNNER_TEMP/native-lifecycle-evidence"

      - name: Upload native lifecycle evidence
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lifecycle-${{ matrix.id }}
          path: ${{ runner.temp }}/native-lifecycle-evidence/
          if-no-files-found: error
          retention-days: 14
