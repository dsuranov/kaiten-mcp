name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-vet:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Verify workflow supply-chain policy
        run: go run ./scripts/verify-workflows.go

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Verify module files
        run: go mod verify

      - name: Verify dependency notices and provenance
        run: go run ./scripts/verify-dependency-policy.go

      - name: Verify native workflow helpers
        shell: bash
        run: |
          go test ./scripts/verify-native-lifecycle-evidence.go ./scripts/verify-native-lifecycle-evidence_test.go
          go test ./scripts/prepare-native-lifecycle-release.go ./scripts/prepare-native-lifecycle-release_test.go
          go test ./scripts/sanitize-native-lifecycle-evidence.go ./scripts/sanitize-native-lifecycle-evidence_test.go
          (cd scripts && go test ./cleanup-native-lifecycle-linux_test.go)

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        shell: bash
        run: ./scripts/verify-go-toolchain.sh

      - name: Run unit and contract tests
        run: go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Run tests with race detector
        run: go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Measure coverage
        shell: bash
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error
          retention-days: 14

  cross-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Install pinned binary vulnerability scanner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-tools"
          GOBIN="$RUNNER_TEMP/security-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$RUNNER_TEMP/security-tools/govulncheck" -version

      - name: Cross-build both executables
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          output="dist/${{ matrix.target }}"
          mkdir -p "$output"
          go build -trimpath -o "$output/kaiten${{ matrix.ext }}" ./cmd/kaiten
          go build -trimpath -o "$output/kaiten-mcp${{ matrix.ext }}" ./cmd/kaiten-mcp

      - name: Verify cross-built binary toolchain and vulnerabilities
        shell: bash
        env:
          GOVULNCHECK_BIN: ${{ runner.temp }}/security-tools/govulncheck
        run: |
          output="dist/${{ matrix.target }}"
          ./scripts/verify-go-binaries.sh \
            "$output/kaiten${{ matrix.ext }}" \
            "$output/kaiten-mcp${{ matrix.ext }}"

      - name: Upload cross-build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  reproducibility:
    name: Reproducible release snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.50.0

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Build two independent snapshots
        shell: bash
        run: ./scripts/verify-reproducible-release.sh --snapshot

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility
          path: dist/reproducibility.txt
          if-no-files-found: error
          retention-days: 14
