name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-vet:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Verify workflow supply-chain policy
        run: go run ./scripts/verify-workflows.go

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Verify module files
        run: go mod verify

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Run unit and contract tests
        run: go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Run tests with race detector
        run: go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Measure coverage
        shell: bash
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Upload coverage evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error
          retention-days: 14

  cross-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Verify selected Go toolchain
        run: ./scripts/verify-go-toolchain.sh

      - name: Install pinned binary vulnerability scanner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-tools"
          GOBIN="$RUNNER_TEMP/security-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$RUNNER_TEMP/security-tools/govulncheck" -version

      - name: Cross-build both executables
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          output="dist/${{ matrix.target }}"
          mkdir -p "$output"
          go build -trimpath -o "$output/kaiten${{ matrix.ext }}" ./cmd/kaiten
          go build -trimpath -o "$output/kaiten-mcp${{ matrix.ext }}" ./cmd/kaiten-mcp

      - name: Verify cross-built binary toolchain and vulnerabilities
        shell: bash
        env:
          GOVULNCHECK_BIN: ${{ runner.temp }}/security-tools/govulncheck
        run: |
          output="dist/${{ matrix.target }}"
          ./scripts/verify-go-binaries.sh \
            "$output/kaiten${{ matrix.ext }}" \
            "$output/kaiten-mcp${{ matrix.ext }}"

      - name: Upload cross-build evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binaries-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
